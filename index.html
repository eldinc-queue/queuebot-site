<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueueBot</title>
<meta name="theme-color" content="#001a33">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="frame.css">
<style>
.door{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px;text-align:center}
.door .logo{background:#fff;padding:14px 22px;width:min(320px,80vw)}
.door .logo img{width:100%;display:block}
.door nav{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.door a{display:block;min-width:150px;padding:14px 22px;background:#e6a51a;color:#001a33;font-weight:800;text-decoration:none;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.door-foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px;text-align:center;font-size:13px}
.door-foot a{display:inline;min-width:0;padding:0;background:none;color:#8ea3bb;font-weight:600;text-decoration:underline;clip-path:none}
.cut{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
</style>
</head>
<body>
<main class="door">
  <div class="logo cut"><img src="icons/motory-logo.png" alt="Motory Group"></div>
  <nav aria-label="Open QueueBot">
    <a href="store/">Store</a>
    <a href="uw/">Underwriting</a>
  </nav>
</main>
<footer class="door-foot"><a href="privacy/">Privacy</a></footer>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
